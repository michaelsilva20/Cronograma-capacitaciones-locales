
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cronograma de Capacitación 2026</title>
  <meta name="description" content="Cronograma de capacitación 2026 de ALCEA ASSA ABLOY." />
  <style>
    :root{
      /* Paleta corporativa basada en logos oficiales ALCEA (púrpura) y ASSA ABLOY (negro)
         Fuente visual: ALCEA usa púrpura en su marca y ASSA ABLOY usa negro en su logotipo. */
      --alcea-purple: #6A1B9A;
      --alcea-purple-light: #9C27B0;
      --assa-black: #000000;
      --bg-dark: #1B1B1B;
      --bg-card: #2A2A2A;
      --text-light: #EAEAEA;
      --muted: #A8A8A8;
      --border: #3A3A3A;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      padding:0;
      background: var(--bg-dark);
      color:var(--text-light);
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial;
    }

    header{
      padding:28px 18px 22px;
      border-bottom:1px solid var(--border);
      background: linear-gradient(90deg, var(--alcea-purple) 0%, var(--assa-black) 100%);
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 16px;
    }

    h1{
      margin:0;
      font-size:28px;
    }

    .subtitle{
      margin-top:6px;
      color:var(--muted);
    }

    .logo{
      width:55px;
      height:55px;
      border-radius:12px;
      background: var(--alcea-purple);
      box-shadow:0 0 20px rgba(106,27,154,0.4);
    }

    .panel{
      padding:18px;
      margin:18px 0;
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:14px;
    }

    .filters{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }
    @media (max-width:700px){
      .filters{
        grid-template-columns:repeat(2,1fr);
      }
    }

    label{
      display:block;
      font-size:13px;
      margin-bottom:4px;
      color:var(--muted);
    }

    select,input{
      width:100%;
      padding:10px;
      background:#1F1F1F;
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text-light);
    }

    .btn{
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      border:1px solid var(--border);
      background:#1F1F1F;
      color:var(--text-light);
    }

    .btn.primary{
      background: var(--alcea-purple);
      border:none;
      color:white;
      font-weight:bold;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:14px;
    }

    .month{
      grid-column:span 12;
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
    }

    .month h3{
      margin:0;
      padding:12px 14px;
      background:var(--alcea-purple);
      color:white;
      display:flex;
      justify-content:space-between;
      font-size:16px;
    }

    .events{
      display:grid;
      grid-template-columns:repeat(12,1fr);
    }

    .event{
      grid-column:span 6;
      border-bottom:1px dashed var(--border);
      padding:12px 14px;
      display:flex;
      gap:12px;
    }
    @media (max-width:800px){
      .event{
        grid-column:span 12;
      }
    }

    .date{
      min-width:70px;
      text-align:center;
      border:1px solid var(--border);
      padding:8px;
      border-radius:10px;
    }
    .date .d{
      font-size:20px;
      font-weight:bold;
    }
    .date .m{
      font-size:12px;
      color:var(--muted);
    }

    .title{
      font-weight:bold;
      margin-bottom:4px;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:6px 0;
    }

    .badge{
      background:#1F1F1F;
      border:1px solid var(--border);
      padding:4px 8px;
      border-radius:8px;
      font-size:12px;
      color:var(--muted);
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    footer{
      text-align:center;
      padding:20px;
      color:var(--muted);
      border-top:1px solid var(--border);
      margin-top:30px;
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="logo"></div>
      <div>
        <h1>Cronograma de Capacitación 2026</h1>
        <p class="subtitle">Consulta y filtra la programación anual de formación.</p>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="panel">
    <div class="filters">
      <div>
        <label for="mes">Mes</label>
        <select id="mes">
          <option value="todos">Todos</option>
          <option value="0">Enero</option>
          <option value="1">Febrero</option>
          <option value="2">Marzo</option>
          <option value="3">Abril</option>
          <option value="4">Mayo</option>
          <option value="5">Junio</option>
          <option value="6">Julio</option>
          <option value="7">Agosto</option>
          <option value="8">Septiembre</option>
          <option value="9">Octubre</option>
          <option value="10">Noviembre</option>
          <option value="11">Diciembre</option>
        </select>
      </div>

      <div>
        <label for="modalidad">Modalidad</label>
        <select id="modalidad">
          <option value="todas">Todas</option>
          <option value="Presencial">Presencial</option>
          <option value="Virtual">Virtual</option>
          <option value="Híbrida">Híbrida</option>
        </select>
      </div>

      <div>
        <label for="busqueda">Búsqueda</label>
        <input id="busqueda" type="search" placeholder="Tema, instructor, lugar..." />
      </div>

      <div style="display:flex;align-items:center;gap:6px;">
        <input id="soloProximos" type="checkbox" />
        <label for="soloProximos">Solo próximos</label>
      </div>

    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;">
      <button id="exportCSV" class="btn">Exportar CSV</button>
      <button id="limpiar" class="btn">Limpiar filtros</button>
    </div>
  </section>

  <section id="contenedor" class="grid" aria-live="polite"></section>

</main>

<footer>
  © 2026 — ALCEA / ASSA ABLOY — Cronograma de capacitación.
</footer>
