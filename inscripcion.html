
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inscripción — ALCEA / ASSA ABLOY</title>
  <meta name="color-scheme" content="light only" />
  <style>
    :root{
      --alcea-purple:#6A1B9A; --alcea-purple-600:#7B1FA2; --month-bg:#260E56;
      --bg:#FFFFFF; --fg:#1B1B1B; --muted:#5F6B7A; --border:#E6E8EC; --chip:#F4F5F7; --focus:#1A73E8;
      --shadow:0 4px 12px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial}
    img{max-width:100%;height:auto;display:block}
    .wrap{max-width:820px;margin:0 auto;padding:0 16px}
    header{border-bottom:1px solid var(--border);background:#fff}
    .hero{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:16px 0}
    .brand{display:flex;gap:12px;align-items:center}
    .brand img{width:210px}
    h1{margin:0;font-size:22px}
    a.link{color:var(--alcea-purple);text-decoration:none}
    a.link:hover{text-decoration:underline}
    .card{margin:18px 0;padding:18px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
    .evt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .badge{background:#FAFAFA;border:1px solid var(--border);padding:6px 10px;border-radius:999px;color:#596072}
    .label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
    input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
    input:focus,button:focus{outline:3px solid var(--focus);outline-offset:2px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:640px){.row{grid-template-columns:1fr}}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
    .btn.primary{background:var(--alcea-purple);border:none;color:#fff;font-weight:600}
    .btn.primary:hover{background:var(--alcea-purple-600)}
    .msg{margin-top:10px;font-size:14px}
    .ok{color:#0f5132;background:#d1e7dd;border:1px solid #badbcc;padding:10px;border-radius:10px}
    .error{color:#842029;background:#f8d7da;border:1px solid #f5c2c7;padding:10px;border-radius:10px}
    footer{color:#6a737d;padding:18px 0 28px;text-align:center;border-top:1px solid var(--border);margin-top:24px}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="hero">
        <div class="brand">
          <img src="ALCEA_Dark_Logo_RGB.png.png" alt="ALCEA / ASSA ABLOY">
          <h1>Inscripción a capacitación</h1>
        </div>
        <a class="link" href="index.html">← Volver al cronograma</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Datos del evento -->
    <section class="card" id="cardEvento" aria-live="polite">
      <div class="evt">
        <span class="badge" id="evtNombre">Evento: —</span>
        <span class="badge" id="evtFecha">Fecha: —</span>
      </div>
      <p class="badge" style="margin-top:10px;background:#F2EFFA;border-color:#E1DAF8;color:#2f2550">
        Los campos marcados con * son obligatorios.
      </p>
    </section>

    <!-- Formulario -->
    <section class="card">
      <form id="formInscripcion" novalidate>
        <div class="row">
          <div>
            <label class="label" for="nombre">Nombre completo *</label>
            <input id="nombre" name="nombre" type="text" required autocomplete="name" />
          </div>
          <div>
            <label class="label" for="email">Email *</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <div>
            <label class="label" for="empresa">Empresa *</label>
            <input id="empresa" name="empresa" type="text" required />
          </div>
          <div>
            <label class="label" for="cargo">Cargo *</label>
            <input id="cargo" name="cargo" type="text" required />
          </div>
        </div>

        <!-- Campos ocultos para el evento -->
        <input type="hidden" id="evento" name="evento" />
        <input type="hidden" id="fecha" name="fecha" />

        <!-- Honeypot anti-bots -->
        <input type="text" id="_hp" name="_hp" style="display:none" tabindex="-1" autocomplete="off"/>

        <div style="display:flex;gap:10px;align-items:center;margin-top:16px">
          <button id="btnEnviar" class="btn primary" type="submit">Enviar inscripción</button>
          <span id="estado" class="msg" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>
  </main>

  <footer>
    © 2026 — ALCEA / ASSA ABLOY — Inscripciones.
  </footer>

  <!-- EmailJS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // 1) Carga de datos del evento desde la URL
    const params = new URLSearchParams(location.search);
    const eventoUrl = params.get('evento') || 'Capacitación';
    const fechaIso = params.get('fecha') || null;
    const fechaFmt = fechaIso
      ? new Intl.DateTimeFormat("es-CO", { dateStyle: "full", timeStyle: "short", timeZone: "America/Bogota" }).format(new Date(fechaIso))
      : "—";
    document.getElementById('evtNombre').textContent = "Evento: " + eventoUrl;
    document.getElementById('evtFecha').textContent = "Fecha: " + fechaFmt;
    document.getElementById('evento').value = eventoUrl;
    document.getElementById('fecha').value = fechaFmt;

    // 2) Configura EmailJS (reemplaza estas constantes)
    const EMAILJS_PUBLIC_KEY = "YOUR_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    // 3) Envío del formulario
    const form = document.getElementById('formInscripcion');
    const btn = document.getElementById('btnEnviar');
    const estado = document.getElementById('estado');

    function setStatus(msg, type){
      estado.className = 'msg ' + (type ? (type === 'ok' ? 'ok' : 'error') : '');
      estado.textContent = msg || '';
    }

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      setStatus('');

      // Honeypot
      if (document.getElementById('_hp').value) return;

      // Validaciones
      const nombre  = form.nombre.value.trim();
      const email   = form.email.value.trim();
      const empresa = form.empresa.value.trim();
      const cargo   = form.cargo.value.trim();
      if(!nombre || !email || !empresa || !cargo){
        setStatus('Por favor completa todos los campos obligatorios.', 'error');
        return;
      }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        setStatus('Ingresa un email válido.', 'error');
        return;
      }

      btn.disabled = true; btn.textContent = "Enviando…";
      try{
        const templateParams = {
          evento: document.getElementById('evento').value,
          fecha:  document.getElementById('fecha').value,
          nombre, empresa, cargo,
          email,           // de la persona
          to_email: email  // destinatario de confirmación
          // admin_email: "formacion@tuempresa.com" // opcional si tu plantilla lo contempla
        };
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
        setStatus('¡Inscripción enviada! Revisa tu correo para confirmar.', 'ok');
        form.reset();
      }catch(err){
        console.error(err);
        setStatus('No se pudo enviar la inscripción. Intenta más tarde.', 'error');
      }finally{
        btn.disabled = false; btn.textContent = "Enviar inscripción";
      }
    });
  </script>
</body>
</html>
